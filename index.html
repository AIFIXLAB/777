<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Spin Score Board</title>
<style>
:root{--bg:#161226;--card:#231c3d;--line:#3a2f63;--tx:#f3eefc;--mut:#a79ccb;--gold:#ffd666;--good:#5fe08a;--bad:#ff6b81}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:24px 16px 60px}h1{margin:0;font-size:30px;color:var(--gold)}.sub{color:var(--mut);margin:4px 0 20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
textarea{width:100%;min-height:64px;background:#120e22;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
button,select{background:var(--gold);color:#2b1c00;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}select{background:#120e22;color:var(--tx);border:1px solid var(--line);font-weight:400}
.hint{color:var(--mut);font-size:13px}.err{color:var(--bad);margin-top:10px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.sum b{display:block;font-size:26px}.sum span{color:var(--mut);font-size:13px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.nft{margin-top:12px}.nft h3{margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.nft .m{color:var(--mut);font-size:13px;margin-bottom:8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.chip{display:flex;justify-content:space-between;gap:8px;background:#120e22;border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:6px 10px;font-size:14px}
.chip small{color:var(--mut);display:block;font-size:11px}.chip b{white-space:nowrap}
.t0{border-left-color:#bbb}.t1{border-left-color:#6ee07a}.t2{border-left-color:#5aa0ff}.t3{border-left-color:#bd6eff}.t4{border-left-color:#ffaa3c}.t5{border-left-color:#ff5078}
</style></head><body><div class="w">
<h1>Monster Spin Score Board</h1>
<p class="sub">Enter your NFT numbers or wallet. Gold, gems and treasure add points; junk and cursed loot take them away.</p>
<div class="box">
<textarea id="q" placeholder="NFT numbers: 1, 25, 100-110&#10;or a wallet address: 0x..."></textarea>
<div class="row"><button id="go">Calculate</button>

<input type="hidden" id="src" value="chain"><span class="hint">Max 200 NFTs per lookup.</span></div><div id="err" class="err"></div></div>
<div id="out"></div></div>
<script src="site_items.js"></script>
<script>
// ===== CONFIG: fill in after you deploy =====
const CFG={CONTRACT:"",RPC:"https://rpc.mainnet.chain.robinhood.com",GATEWAY:"https://ipfs.io/ipfs/"};
// ============================================
const $=id=>document.getElementById(id),TIERS=["Common","Uncommon","Rare","Epic","Legendary","Mythic"];
const hex=(n,l=64)=>BigInt(n).toString(16).padStart(l,"0");
async function rpc(to,data){const r=await fetch(CFG.RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_call",params:[{to:CFG.CONTRACT,data},"latest"]})});const j=await r.json();if(j.error)throw new Error(j.error.message);return j.result}
function decStr(h){h=h.slice(2);const len=parseInt(h.slice(64,128),16);const b=h.slice(128,128+len*2).match(/../g)||[];return new TextDecoder().decode(new Uint8Array(b.map(x=>parseInt(x,16))))}
const url=u=>u.startsWith("ipfs://")?CFG.GATEWAY+u.slice(7):u;
async function chainToken(id){const uri=decStr(await rpc(CFG.CONTRACT,"0xc87b56dd"+hex(id)));const m=await (await fetch(url(uri))).json();
 const a=m.attributes||[],g=n=>(a.find(x=>x.trait_type===n)||{}).value;
 return{id,bg:g("Background"),grade:g("Pile Grade"),items:a.filter(x=>/^Slot \d+$/.test(x.trait_type)).map(x=>x.value)}}
function demoToken(id){const d=DEMO[id-1];if(!d)throw new Error("No demo data for #"+id);const t=d.slice(1).reduce((s,i)=>s+ITEMS[NAMES[i]][0],0);
 return{id,bg:BGNAMES[d[0]],grade:(GRADES.find(g=>t<=g[1])||[])[0],items:d.slice(1).map(i=>NAMES[i])}}
function parseIds(s){const out=new Set();for(const p of s.split(/[\s,;]+/).filter(Boolean)){const m=p.match(/^(\d+)-(\d+)$/);if(m){for(let i=+m[1];i<=+m[2]&&out.size<=200;i++)out.add(i)}else if(/^\d+$/.test(p))out.add(+p);else throw new Error("Can’t read: "+p)}
 if(out.size>200)throw new Error("Please look up 200 NFTs or fewer at a time.");return[...out]}
async function walletIds(addr){const pad=addr.slice(2).toLowerCase().padStart(64,"0");const n=Number(BigInt(await rpc(CFG.CONTRACT,"0x70a08231"+pad)));
 if(n>200)throw new Error("This wallet holds "+n+" NFTs; looking up the first 200.");const ids=[];
 for(let i=0;i<Math.min(n,200);i++)ids.push(Number(BigInt(await rpc(CFG.CONTRACT,"0x2f745c59"+pad+hex(i)))));return ids}
const sg=n=>(n>0?"+":"")+n,cls=n=>n>0?"pos":n<0?"neg":"";
function card(t){const rows=t.items.map(n=>{const it=ITEMS[n]||[0,"?","Common",0];return{n,s:it[0],ty:it[1],ti:it[2],p:it[3]}});
 const tot=rows.reduce((a,r)=>a+r.s,0);
 return`<div class="box nft"><h3><span>Monster Spin #${t.id}</span><span class="${cls(tot)}">${sg(tot)} pts</span></h3>
 <div class="m">${t.grade||""} · Background: ${t.bg||"?"}</div><div class="chips">${rows.map(r=>`<div class="chip t${TIERS.indexOf(r.ti)}"><span>${r.n}<small>${r.ty} · ${r.ti} · ${r.p}%</small></span><b class="${cls(r.s)}">${sg(r.s)}</b></div>`).join("")}</div></div>`}
async function run(){$("err").textContent="";$("out").innerHTML="";const q=$("q").value.trim();if(!q)return;$("go").disabled=true;
 try{const demo=$("src").value==="demo";if(!demo&&!CFG.CONTRACT)throw new Error("Set CFG.CONTRACT in index.html first.");
  let ids=/^0x[0-9a-fA-F]{40}$/.test(q)?(demo?(()=>{throw new Error("Wallet lookup needs live mode.")})():await walletIds(q)):parseIds(q);
  const toks=[];for(const id of ids){try{toks.push(demo?demoToken(id):await chainToken(id))}catch(e){$("err").textContent+="#"+id+": "+e.message+"  "}}
  const S={pts:0,Gold:0,Junk:0,Cursed:0,Gem:0};
  for(const t of toks)for(const n of t.items){const it=ITEMS[n];if(!it)continue;S.pts+=it[0];if(S[it[1]]!==undefined)S[it[1]]++}
  $("out").innerHTML=`<div class="sum"><div><b class="${cls(S.pts)}">${sg(S.pts)}</b><span>Total score</span></div><div><b>${toks.length}</b><span>NFTs</span></div><div><b>${S.Gold}</b><span>Gold items</span></div><div><b>${S.Junk}</b><span>Junk items</span></div><div><b>${S.Cursed}</b><span>Cursed items</span></div><div><b>${S.Gem}</b><span>Gem items</span></div></div>`+toks.map(card).join("")
 }catch(e){$("err").textContent=e.message}$("go").disabled=false}
$("go").onclick=run;$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))run()});
</script></body></html>
